<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <title>Offline - 3D Tour</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e6edf3;
      padding: 20px;
    }
    .box { text-align: center; max-width: 400px; }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { color: #8b949e; margin-bottom: 20px; line-height: 1.5; }
    button {
      background: #238636;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #2ea043; }
    .status {
      margin-top: 20px;
      padding: 12px;
      background: rgba(56, 139, 253, 0.1);
      border: 1px solid rgba(56, 139, 253, 0.3);
      border-radius: 8px;
      font-size: 14px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>Your cached data is still available. You can browse previously loaded content.</p>
    <button onclick="window.location.reload()">🔄 Try Again</button>
    <div class="status" id="status">Checking connection...</div>
  </div>
  <script>
    function update() {
      const el = document.getElementById('status');
      if (navigator.onLine) {
        el.textContent = '✅ Back online!';
        setTimeout(() => window.location.reload(), 1000);
      } else {
        el.textContent = 'Still offline - cached data available';
      }
    }
    window.addEventListener('online', update);
    window.addEventListener('offline', update);
    update();
  </script>
</body>
</html>

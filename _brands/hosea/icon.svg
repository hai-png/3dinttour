<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Hosea Real Estate Logo -->
  <defs>
    <clipPath id="round">
      <rect width="512" height="512" rx="80" />
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background -->
    <rect width="512" height="512" fill="#ffffff" />

    <!-- Stylized H - Green -->
    <polygon points="120,120 135,120 135,235 210,235 210,245 135,280 135,392 120,392" fill="#2d8a4e" />

    <!-- Left swoosh - Black -->
    <path d="M 100,100 Q 95,256 100,412" stroke="#1a1a1a" stroke-width="18" fill="none" stroke-linecap="round" />

    <!-- Right swoosh - Black -->
    <path d="M 240,100 Q 245,256 240,412" stroke="#1a1a1a" stroke-width="18" fill="none" stroke-linecap="round" />

    <!-- HOSEA Text - Black -->
    <text x="270" y="245" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="bold" fill="#1a1a1a" letter-spacing="-2">OSEA</text>

    <!-- REAL ESTATE Text - Black -->
    <text x="275" y="310" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#1a1a1a" letter-spacing="12">REAL ESTATE</text>
  </g>
</svg>

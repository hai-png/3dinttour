<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1628">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Offline - 3D Property Tour</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a1628;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e8e8e8;
      padding: 20px;
    }
    .box { text-align: center; max-width: 400px; }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { color: #b0b8c4; margin-bottom: 20px; line-height: 1.5; }
    button {
      background: #1a5276;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover { background: #2980b9; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }
    .status {
      margin-top: 20px;
      padding: 12px;
      background: rgba(56, 139, 253, 0.1);
      border: 1px solid rgba(56, 139, 253, 0.3);
      border-radius: 8px;
      font-size: 14px;
      color: #b0b8c4;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1 id="offline-title">You're Offline</h1>
    <p id="offline-desc">Your cached data is still available. You can browse previously loaded content.</p>
    <div class="actions">
      <button onclick="window.location.href='index.html'" id="offline-view-btn">🏠 View Cached Tour</button>
      <button onclick="window.location.reload()">🔄 Try Again</button>
    </div>
    <div class="status" id="status">Checking connection...</div>
  </div>
  <script>
    // Try to load brand config for offline page customization
    (function() {
      fetch('brand-config.json')
        .then(r => r.json())
        .then(data => {
          const seo = data.seo || {};
          const ui = data.ui || {};
          const labels = ui.labels || {};

          if (seo.offlinePageTitle) document.title = seo.offlinePageTitle;
          if (labels.enterButton) {
            const btn = document.getElementById('offline-view-btn');
            if (btn) btn.textContent = '🏠 ' + labels.enterButton;
          }
        })
        .catch(() => {});
    })();

    function update() {
      const el = document.getElementById('status');
      if (navigator.onLine) {
        el.textContent = '✅ Back online!';
        setTimeout(() => window.location.reload(), 1000);
      } else {
        el.textContent = 'Still offline - cached data available';
      }
    }

    // Check if we have cached data available
    function checkCachedData() {
      if ('serviceWorker' in navigator) {
        caches.keys().then(names => {
          const tourCaches = names.filter(n => n.startsWith('tour-v'));
          if (tourCaches.length === 0) {
            document.getElementById('status').textContent = '⚠️ No cached data available. Please go online first.';
            document.querySelector('.actions').style.display = 'none';
          } else {
            console.log('Found ' + tourCaches.length + ' cached version(s):', tourCaches.join(', '));
          }
        }).catch(() => {});
      }
    }

    window.addEventListener('online', update);
    window.addEventListener('offline', update);
    update();
    checkCachedData();
  </script>
</body>
</html>

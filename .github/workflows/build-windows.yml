name: Build Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wine (for Windows builds)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64 wine

      - name: Install dependencies
        run: |
          npm ci

      - name: Verify model file exists
        run: |
          ls -la model/
          test -f model/building.glb || (echo "ERROR: model/building.glb not found!" && exit 1)

      - name: Build Windows executable
        run: |
          npm run build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Virtual-Tour-Windows
          path: dist/*.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Property Tours</title>
<link rel="icon" type="image/png" href="favicon.ico">
<style>
  :root {
    --bg: #0a1628;
    --card: #132238;
    --card-hover: #1a2d45;
    --text: #e8e8e8;
    --text-muted: #7a8594;
    --border: rgba(255,255,255,.08);
    --radius: 14px;
    --shadow: 0 8px 28px rgba(0,0,0,.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    text-align: center;
    padding: 60px 20px 40px;
    max-width: 600px;
  }

  .header h1 {
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  .header p {
    font-size: 1.05rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .brands {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    padding: 0 24px 60px;
    max-width: 900px;
    width: 100%;
  }

  .brand-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    text-decoration: none;
    color: inherit;
    transition: all 0.25s ease;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: var(--shadow);
  }

  .brand-card:hover {
    background: var(--card-hover);
    transform: translateY(-3px);
    box-shadow: 0 12px 36px rgba(0,0,0,.4);
  }

  .brand-logo {
    width: 100%;
    max-height: 80px;
    object-fit: contain;
    border-radius: 8px;
    background: rgba(255,255,255,.05);
    padding: 8px;
  }

  .brand-name {
    font-size: 1.25rem;
    font-weight: 700;
  }

  .brand-tagline {
    font-size: 0.9rem;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .brand-projects {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: auto;
  }

  .brand-project-tag {
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,.08);
    color: var(--text-muted);
    font-weight: 500;
  }

  .footer {
    text-align: center;
    padding: 20px;
    font-size: 0.8rem;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    width: 100%;
  }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }

  .empty h2 { font-size: 1.3rem; margin-bottom: 8px; color: var(--text); }
  .empty p { font-size: 0.95rem; }
</style>
</head>
<body>

<div class="header">
  <h1>3D Property Tours</h1>
  <p>Interactive virtual tours by leading real estate developers</p>
</div>

<div class="brands" id="brands"></div>

<div class="footer">
  Powered by 3D Interactive Tour Platform
</div>

<script>
  fetch('brands.json')
    .then(r => {
      if (!r.ok) throw new Error('brands.json not found');
      return r.json();
    })
    .then(data => {
      document.title = data.title || '3D Property Tours';
      document.querySelector('.header h1').textContent = data.title;
      document.querySelector('.header p').textContent = data.subtitle || '';

      const container = document.getElementById('brands');

      if (!data.brands || data.brands.length === 0) {
        container.innerHTML = `
          <div class="empty" style="grid-column:1/-1">
            <h2>No brands configured</h2>
            <p>Add brands to <code>brands.json</code> to get started.</p>
          </div>`;
        return;
      }

      container.innerHTML = data.brands.map(brand => `
        <a href="${brand.path}" class="brand-card">
          <img class="brand-logo" src="${brand.logo}" alt="${brand.name}"
               onerror="this.style.display='none'">
          <div class="brand-name">${brand.name}</div>
          <div class="brand-tagline">${brand.tagline || ''}</div>
          ${brand.projects && brand.projects.length > 0 ? `
          <div class="brand-projects">
            ${brand.projects.map(p => `<span class="brand-project-tag">${p}</span>`).join('')}
          </div>` : ''}
        </a>
      `).join('');
    })
    .catch(err => {
      console.error('Failed to load brands:', err);
      document.getElementById('brands').innerHTML = `
        <div class="empty" style="grid-column:1/-1">
          <h2>Unable to load brands</h2>
          <p>${err.message}</p>
        </div>`;
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Property Tours</title>
<link rel="icon" type="image/png" href="favicon.ico">
<style>
  :root {
    --bg: #0a1628;
    --card: #132238;
    --card-hover: #1a2d45;
    --text: #e8e8e8;
    --text-muted: #7a8594;
    --border: rgba(255,255,255,.08);
    --radius: 14px;
    --shadow: 0 8px 28px rgba(0,0,0,.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    text-align: center;
    padding: 60px 20px 40px;
    max-width: 600px;
  }

  .header h1 {
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  .header p {
    font-size: 1.05rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .brands {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    padding: 0 24px 60px;
    max-width: 900px;
    width: 100%;
  }

  .brand-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    text-decoration: none;
    color: inherit;
    transition: all 0.25s ease;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: var(--shadow);
  }

  .brand-card:hover {
    background: var(--card-hover);
    transform: translateY(-3px);
    box-shadow: 0 12px 36px rgba(0,0,0,.4);
  }

  .brand-logo {
    width: 100%;
    max-height: 80px;
    object-fit: contain;
    border-radius: 8px;
    background: rgba(255,255,255,.05);
    padding: 8px;
  }

  .brand-name {
    font-size: 1.25rem;
    font-weight: 700;
  }

  .brand-tagline {
    font-size: 0.9rem;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .brand-projects {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: auto;
  }

  .brand-project-tag {
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,.08);
    color: var(--text-muted);
    font-weight: 500;
  }

  .footer {
    text-align: center;
    padding: 20px;
    font-size: 0.8rem;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    width: 100%;
  }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }

  .empty h2 { font-size: 1.3rem; margin-bottom: 8px; color: var(--text); }
  .empty p { font-size: 0.95rem; }
</style>
</head>
<body>

<div class="header">
  <h1>3D Property Tours</h1>
  <p>Interactive virtual tours by leading real estate developers</p>
</div>

<div class="brands" id="brands"></div>

<div class="footer">
  Powered by 3D Interactive Tour Platform
</div>

<script>
  /**
   * Escape HTML special characters to prevent XSS when inserting text.
   */
  function esc(str) {
    if (typeof str !== 'string') return '';
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /**
   * Validate a URL to ensure it is safe for href/src attributes.
   * Only allows relative paths (./  /) and https:// URLs.
   * Rejects javascript:, data:, vbscript:, and other dangerous schemes.
   */
  function isSafeUrl(url) {
    if (typeof url !== 'string') return false;
    var trimmed = url.trim().toLowerCase();
    // Allow relative paths starting with ./ or /
    if (trimmed.startsWith('./') || trimmed.startsWith('/')) return true;
    // Allow https:// URLs
    if (trimmed.startsWith('https://')) return true;
    // Reject everything else (javascript:, data:, vbscript:, etc.)
    return false;
  }

  /**
   * Build a brand card element using safe DOM APIs (no innerHTML).
   */
  function createBrandCard(brand) {
    var card = document.createElement('a');
    card.className = 'brand-card';

    // Validate and set href — skip if unsafe
    if (!isSafeUrl(brand.path)) {
      console.warn('Rejected unsafe brand.path:', brand.path);
      return null;
    }
    card.setAttribute('href', brand.path);

    // Logo image
    if (brand.logo && isSafeUrl(brand.logo)) {
      var img = document.createElement('img');
      img.className = 'brand-logo';
      img.setAttribute('src', brand.logo);
      img.setAttribute('alt', brand.name || '');
      img.onerror = function() { this.style.display = 'none'; };
      card.appendChild(img);
    }

    // Brand name
    var nameDiv = document.createElement('div');
    nameDiv.className = 'brand-name';
    nameDiv.textContent = brand.name || '';
    card.appendChild(nameDiv);

    // Tagline
    if (brand.tagline) {
      var taglineDiv = document.createElement('div');
      taglineDiv.className = 'brand-tagline';
      taglineDiv.textContent = brand.tagline;
      card.appendChild(taglineDiv);
    }

    // Project tags
    if (brand.projects && Array.isArray(brand.projects) && brand.projects.length > 0) {
      var projectsDiv = document.createElement('div');
      projectsDiv.className = 'brand-projects';
      brand.projects.forEach(function(p) {
        var span = document.createElement('span');
        span.className = 'brand-project-tag';
        span.textContent = p;
        projectsDiv.appendChild(span);
      });
      card.appendChild(projectsDiv);
    }

    return card;
  }

  /**
   * Show an empty-state message using safe DOM construction.
   */
  function showEmptyMessage(container, heading, message) {
    var wrapper = document.createElement('div');
    wrapper.className = 'empty';
    wrapper.style.gridColumn = '1 / -1';

    var h2 = document.createElement('h2');
    h2.textContent = heading;
    wrapper.appendChild(h2);

    var p = document.createElement('p');
    p.textContent = message;
    wrapper.appendChild(p);

    container.appendChild(wrapper);
  }

  fetch('brands.json')
    .then(function(r) {
      if (!r.ok) throw new Error('brands.json not found');
      return r.json();
    })
    .then(function(data) {
      document.title = data.title || '3D Property Tours';
      document.querySelector('.header h1').textContent = data.title;
      document.querySelector('.header p').textContent = data.subtitle || '';

      var container = document.getElementById('brands');

      if (!data.brands || data.brands.length === 0) {
        showEmptyMessage(container, 'No brands configured', 'Add brands to brands.json to get started.');
        return;
      }

      data.brands.forEach(function(brand) {
        var card = createBrandCard(brand);
        if (card) {
          container.appendChild(card);
        }
      });

      // If all brands were rejected by URL validation, show empty state
      if (container.children.length === 0) {
        showEmptyMessage(container, 'No valid brands', 'All brand entries had invalid URLs and were rejected.');
      }
    })
    .catch(function(err) {
      console.error('Failed to load brands:', err);
      var container = document.getElementById('brands');
      // Use textContent for err.message — never innerHTML with untrusted data
      showEmptyMessage(container, 'Unable to load brands', err.message || 'An unknown error occurred.');
    });
</script>
</body>
</html>
